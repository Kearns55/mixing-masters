{% extends 'base.html' %}
{% load static %}

{% block title %}{{ course.title }} | Mixing Masters Workshops{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row">
        <div class="col-md-6">
            <img src="{{ course.image_url }}" alt="{{ course.title }}" class="img-fluid rounded shadow-sm">
        </div>
        <div class="col-md-6">
            <h1 class="mb-4">{{ course.title }}</h1>
            <p class="lead">{{ course.description }}</p>
            <p class="h4 mt-4">Price: €{{ course.price }}</p>
            <a href="#" class="btn btn-primary btn-lg mt-4">Enroll Now</a>
        </div>
    </div>

{% endblock %}
