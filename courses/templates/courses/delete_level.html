{% extends 'base.html' %}

{% block title %}Delete {{ level.name }} | Mixing Masters Workshops{% endblock %}

{% block content %}
<div class="container mt-5 card delete-card">
    <h1 class="text-center mb-4">Delete {{ level.name }}</h1>
    <p class="text-center">Are you sure you want to delete this level?</p>
        <form method="post" class="delete-form">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary">Yes, delete</button>
            <a href="{% url 'courses:admin_dashboard' %}" class="btn btn-secondary">Cancel</a>
        </form>
</div>
{% endblock %}
