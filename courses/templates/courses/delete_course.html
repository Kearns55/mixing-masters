{% extends 'base.html' %}

{% block title %}Delete {{ course.name }} | Mixing Masters Workshops{% endblock %}

{% block content %}
<div class="container mt-5 card delete-card">
    <h1 class="text-center mb-4">Delete {{ course.name }}</h1>
    <p class="text-center">Are you sure you want to delete this course?</p>
        <form method="post" class="delete-form">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary">Yes, delete</button>
            <a href="{% url 'courses:course_detail' course.pk %}" class="btn btn-secondary">Cancel</a>
        </form>
</div>
{% endblock %}
