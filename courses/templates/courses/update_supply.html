{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}

<h1 class="text-center">Update {{ supply }}</h1>

<form method="post" class="text-center">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary form-btn">Update Supply</button>
</form>

{% endblock %}
